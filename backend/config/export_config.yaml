# =============================================================================
# Function Calling Export 설정
# 내보내기 의도 감지를 위한 힌트 키워드와 설정
# =============================================================================

# 형식 관련 힌트 키워드
# 사용자가 내보내기를 원하는 파일 형식을 나타내는 단어들
format_hints:
  - "엑셀"
  - "excel"
  - "xlsx"
  - "xls"
  - "스프레드시트"
  - "워드"
  - "word"
  - "docx"
  - "doc"
  - "pdf"
  - "피디에프"
  - "마크다운"
  - "markdown"
  - "md"
  - "txt"
  - "텍스트"
  - "text"

# 동작 관련 힌트 키워드
# 사용자가 내보내기 동작을 나타내는 단어들
action_hints:
  - "저장"
  - "다운로드"
  - "download"
  - "내보내"
  - "export"
  - "변환"
  - "만들어"
  - "생성"
  - "뽑아"
  - "추출"

# 파일 관련 힌트 키워드
# 파일 출력을 암시하는 단어들
file_hints:
  - "파일"
  - "file"
  - "문서"

# 최소 매칭 힌트 개수
# 이 개수 이상의 힌트가 매칭되면 내보내기 가능성 있음으로 판단
# LLM에게 최종 판단을 위임
min_match_count: 2

# 설정 변경 후 서버 재시작 필요
# Hot reload는 향후 구현 예정
